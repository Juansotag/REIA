{% for dim in rubrica.dimensiones %}
{% set val = sugerencias.get(dim.clave, 4.0) %}
<div style="background: #fff; padding: 0.85rem; border-radius: 6px; border: 1.5px solid var(--c-yellow); animation: fadeSlideIn 0.3s ease;">
  <div style="display: flex; justify-content: space-between; margin-bottom: 0.4rem;">
    <strong style="font-size: var(--fs-sm); color: var(--c-blue-dark);">
      {{ dim.nombre }} <span style="font-size: 0.75rem; color: #7a5c00;">(Sugerido por IA)</span>
    </strong>
    <span id="label-val-{{ dim.clave }}" style="font-weight: 700; color: var(--c-yellow); font-size: var(--fs-base);">{{ "%.1f"|format(val) }}</span>
  </div>
  <input type="range" name="dim_{{ dim.clave }}" id="range-{{ dim.clave }}"
         min="0.0" max="5.0" step="0.1" value="{{ val }}"
         style="width: 100%; accent-color: var(--c-yellow);"
         oninput="document.getElementById('label-val-{{ dim.clave }}').innerText = parseFloat(this.value).toFixed(1)">
  <div style="display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--text-muted); margin-top: 0.2rem;">
    <span>0.0 (Bajo)</span>
    <span>3.0 (Basico)</span>
    <span>4.0 (Alto)</span>
    <span>5.0 (Superior)</span>
  </div>
</div>
{% endfor %}
