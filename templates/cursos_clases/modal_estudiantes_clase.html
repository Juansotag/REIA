<div class="modal-overlay" onclick="if(event.target===this) this.remove()">
  <div class="modal-box" style="max-width: 680px; max-height: 88vh; display: flex; flex-direction: column;">
    <div class="modal-header">
      <div>
        <h3 style="margin: 0;">Asignar Estudiantes a la Asignatura</h3>
        <div style="font-size: var(--fs-xs); color: var(--text-muted); margin-top: 0.2rem;">
          Asignatura: <strong>{{ clase.nombre }}</strong> (Área: {{ clase.area }})
        </div>
      </div>
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">x</button>
    </div>

    <!-- Buscador y Acciones Rápidas -->
    <div style="padding: 0.75rem 0; border-bottom: 1px solid var(--border-color); display: flex; gap: 0.75rem; align-items: center; justify-content: space-between;">
      <input type="text" id="filtro-estudiantes-clase" placeholder="Filtrar por nombre o documento..."
             style="flex: 1; padding: 0.4rem 0.75rem; font-size: var(--fs-sm);"
             oninput="filtrarEstudiantesClase(this.value)">
      <div style="display: flex; gap: 0.35rem;">
        <button type="button" class="secondary" style="padding: 0.35rem 0.6rem; font-size: var(--fs-xs);" onclick="marcarTodosClase(true)">
          Marcar todos
        </button>
        <button type="button" class="ghost" style="padding: 0.35rem 0.6rem; font-size: var(--fs-xs);" onclick="marcarTodosClase(false)">
          Desmarcar
        </button>
      </div>
    </div>

    <!-- Lista de Estudiantes con Checkbox -->
    <form method="post" action="/cursos-clases/clase/{{ clase.id }}/estudiantes" style="flex: 1; overflow-y: auto; padding: 0.75rem 0;">
      <div id="lista-estudiantes-clase" style="display: flex; flex-direction: column; gap: 0.4rem;">
        {% for est in todos_estudiantes %}
        <label class="item-estudiante-clase-check" data-texto="{{ est.nombre_completo.lower() }} {{ est.numero_documento }}"
               style="display: flex; align-items: center; justify-content: space-between; padding: 0.5rem 0.75rem; border-radius: var(--radius-sm); background: var(--bg-main); cursor: pointer; border: 1px solid transparent; transition: background 0.15s;">
          <div style="display: flex; align-items: center; gap: 0.65rem;">
            <input type="checkbox" name="estudiante_ids[]" value="{{ est.id }}"
                   {% if est.id in matriculados_ids %}checked{% endif %}
                   style="width: 17px; height: 17px; accent-color: var(--c-blue-primary); cursor: pointer;">
            <div>
              <strong style="color: var(--c-blue-dark); font-size: var(--fs-sm);">{{ est.nombre_completo }}</strong>
              <div style="font-size: var(--fs-xs); color: var(--text-muted);">
                Doc: {{ est.tipo_documento }} {{ est.numero_documento }} &bull; Grado actual: {{ est.grado_actual }}º
              </div>
            </div>
          </div>
          {% if est.id in matriculados_ids %}
          <span class="resultado-badge acuerdo" style="font-size: 0.65rem;">Inscrito</span>
          {% endif %}
        </label>
        {% endfor %}
      </div>

      <div class="modal-actions" style="margin-top: 1rem; border-top: 1px solid var(--border-color); padding-top: 0.75rem; display: flex; justify-content: flex-end; gap: 0.5rem;">
        <button type="button" class="ghost" onclick="this.closest('.modal-overlay').remove()">Cancelar</button>
        <button type="submit" class="primary">Guardar Estudiantes de la Asignatura</button>
      </div>
    </form>
  </div>
</div>

<script>
function filtrarEstudiantesClase(query) {
  const q = query.toLowerCase().trim();
  const items = document.querySelectorAll('.item-estudiante-clase-check');
  items.forEach(el => {
    const txt = el.getAttribute('data-texto') || '';
    if (!q || txt.includes(q)) {
      el.style.display = 'flex';
    } else {
      el.style.display = 'none';
    }
  });
}

function marcarTodosClase(marcar) {
  const visibleCheckboxes = document.querySelectorAll('.item-estudiante-clase-check');
  visibleCheckboxes.forEach(el => {
    if (el.style.display !== 'none') {
      const cb = el.querySelector('input[type="checkbox"]');
      if (cb) cb.checked = marcar;
    }
  });
}
</script>
