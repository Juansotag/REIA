<div class="modal-overlay" onclick="if(event.target===this) this.remove()">
  <div class="modal-box" style="max-width: 500px;">
    <div class="modal-header">
      <h3>{% if clase %}Editar Asignatura / Clase{% else %}Nueva Asignatura / Clase{% endif %}</h3>
      <button class="modal-close" onclick="this.closest('.modal-overlay').remove()">x</button>
    </div>

    <form method="post" action="{% if clase %}/cursos-clases/clase/{{ clase.id }}{% else %}/cursos-clases/clase{% endif %}">
      <div class="form-group" style="margin-bottom: 0.85rem;">
        <label for="nombre_clase" style="font-weight: 700; color: var(--c-blue-dark); font-size: var(--fs-sm);">Nombre de la Asignatura</label>
        <input type="text" id="nombre_clase" name="nombre" value="{{ clase.nombre if clase else '' }}" placeholder="ej. Filosofía y Argumentación" required style="width: 100%;">
      </div>

      <div class="form-group" style="margin-bottom: 0.85rem;">
        <label for="area_clase" style="font-weight: 700; color: var(--c-blue-dark); font-size: var(--fs-sm);">Área de Conocimiento</label>
        <input type="text" id="area_clase" name="area" value="{{ clase.area if clase else '' }}" placeholder="ej. Humanidades y Ciencias Sociales" required style="width: 100%;">
      </div>

      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="desc_clase" style="font-weight: 700; color: var(--c-blue-dark); font-size: var(--fs-sm);">Descripción y Enfoque Curricular</label>
        <textarea id="desc_clase" name="descripcion" rows="3" placeholder="Competencias formativas y objetivos de la clase..." style="width: 100%; border: 1.5px solid var(--c-blue-tint); border-radius: var(--radius-sm); padding: 0.5rem; font-family: inherit; font-size: var(--fs-sm);">{{ clase.descripcion if clase else '' }}</textarea>
      </div>

      <div class="modal-actions" style="display: flex; justify-content: flex-end; gap: 0.5rem;">
        <button type="button" class="ghost" onclick="this.closest('.modal-overlay').remove()">Cancelar</button>
        <button type="submit" class="primary">{% if clase %}Actualizar Asignatura{% else %}Crear Asignatura{% endif %}</button>
      </div>
    </form>
  </div>
</div>
